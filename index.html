<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Generador de paletas de colores aleatorias en HEX y HSL" />
  <title>Paleta Studio — Generador de Colores</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Mono:wght@300;400;500&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="style.css" />

</head>

<body>
  <div
    id="toast"
    class="toast"
    role="alert"
    aria-live="polite"
    aria-atomic="true"
  >
    ✓ Color copiado al portapapeles
  </div>

  <header class="site-header">
    <div class="header-content">
      <div class="logo" aria-hidden="true">
        <span class="logo-dot"></span>
      </div>
      <div class="header-text">
        <h1 class="site-title">Paleta Studio</h1>
        <p class="site-subtitle">Generador de paletas de colores aleatorias</p>
      </div>
    </div>
  </header>

  <main class="main-content">

    <section class="controls-section" aria-labelledby="controls-title">
      <h2 id="controls-title" class="section-title">Configura tu paleta</h2>

      <div class="controls-grid">

        <fieldset class="control-group">
          <legend class="control-label">Cantidad de colores</legend>
          <div class="radio-group">

            <label class="radio-option" for="size-6">
              <input type="radio" id="size-6" name="palette-size" value="6" checked />
              <span class="radio-label">6</span>
            </label>

            <label class="radio-option" for="size-8">
              <input type="radio" id="size-8" name="palette-size" value="8" />
              <span class="radio-label">8</span>
            </label>

            <label class="radio-option" for="size-9">
              <input type="radio" id="size-9" name="palette-size" value="9" />
              <span class="radio-label">9</span>
            </label>

          </div>
        </fieldset>

        <fieldset class="control-group">
          <legend class="control-label">Formato de color</legend>
          <div class="radio-group">

            <label class="radio-option" for="format-hex">
              <input type="radio" id="format-hex" name="color-format" value="hex" checked />
              <span class="radio-label">HEX</span>
            </label>

            <label class="radio-option" for="format-hsl">
              <input type="radio" id="format-hsl" name="color-format" value="hsl" />
              <span class="radio-label">HSL</span>
            </label>

          </div>
        </fieldset>

      </div>

      <button
        type="button"
        id="btn-generate"
        class="btn-generate"
        aria-label="Generar nueva paleta de colores aleatoria"
      >
        <span class="btn-icon" aria-hidden="true">⟳</span>
        <span class="btn-text">Generar paleta</span>
      </button>

    </section>

    <section
      class="palette-section"
      aria-labelledby="palette-title"
      aria-live="polite"
    >
      <div class="palette-header">
        <h2 id="palette-title" class="section-title">Tu paleta</h2>
        <button
          type="button"
          id="btn-save"
          class="btn-secondary"
          aria-label="Guardar paleta actual"
        >
          Guardar paleta
        </button>
      </div>

      <div
        id="palette-grid"
        class="palette-grid"
        role="list"
        aria-label="Colores de la paleta generada"
      >
        <div class="empty-state" id="empty-state">
          <p>Presiona <strong>Generar paleta</strong> para comenzar</p>
        </div>
      </div>

    </section>

    <section
      class="saved-section"
      id="saved-section"
      aria-labelledby="saved-title"
      hidden
    >
      <h2 id="saved-title" class="section-title">Paletas guardadas</h2>
      <div id="saved-list" class="saved-list"></div>
    </section>

  </main>

  <footer class="site-footer">
    <p>Hecho por Nicolás Torres · Módulo 1 — Desarrollo Full Stack</p>
  </footer>

  <script src="script.js"></script>

</body>
</html>
